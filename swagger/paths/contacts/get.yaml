tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: 'Retrieve a paginated and filtered list of contacts belonging to the authenticated user'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      description: Page number
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      description: Number of contacts per page
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      description: Field to sort by
      type: string
      example: name
  - in: query
    name: sortOrder
    schema:
      description: Sort order
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
  - in: query
    name: isFavourite
    schema:
      description: Filter by favourite contacts
      type: boolean
      example: true
  - in: query
    name: contactType
    schema:
      description: Filter by contactType
      type: string
      enum: ['work', 'home', 'personal']
      example: personal
responses:
  '200':
    description: 'Successfully found contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 1
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 3
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml


