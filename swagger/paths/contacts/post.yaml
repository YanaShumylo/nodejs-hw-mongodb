tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
        - name
        - phoneNumber
        - email
        - isFavourite
        - contactType
        - photo
        properties:
          name:
            description: "Contact's name"
            type: string
            example: Mila Nazarchuk
          phoneNumber:
            description: "Contact's phoneNumber"
            type: number
            example: 380504865432
          email:
            description: "Contact's email"
            type: string
            example: mila234@gmail.com
          isFavourite:
            description: "Whether the contact is marked as a favourite"
            type: boolean
            default: false
            example: true
          contactType:
            description: "Type of contact"
            type: string
            enum: ['work', 'home', 'personal']
            example: home
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: 'Successfully created a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../components/responses/500.yaml

